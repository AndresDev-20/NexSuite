# Netlify: el sitio publicado funciona en MODO DEMOSTRACIÓN (sin backend, con los datos ficticios de
# demo-db.json). Solo se define esta variable: el comando de compilación y la carpeta de publicación
# siguen siendo los que ya tiene configurados el sitio en Netlify.
#
# Para conectar el sitio publicado a un backend real: cambia "true" por "false" (o borra esta
# sección) y define VITE_REACT_APP_URL con la URL pública de la API.
[build.environment]
  VITE_DEMO_MODE = "true"
